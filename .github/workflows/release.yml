name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :androidApp:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: counter-apk
          path: androidApp/build/outputs/apk/release/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: androidApp/build/outputs/apk/release/*.apk

  windows-msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktopApp:packageMsi --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: counter-msi
          path: desktopApp/build/compose/binaries/main/msi/*.msi
      - uses: softprops/action-gh-release@v2
        with:
          files: desktopApp/build/compose/binaries/main/msi/*.msi